# Publish the fork's @norskvideo/moq-* packages to npm (fork-only workflow).
#
# Runs js/publish-norskvideo.ts --publish. npm authenticates by OIDC trusted
# publishing: no NPM_TOKEN, no OTP, provenance attached. Each of the nine
# packages must name this repo and this workflow filename as its trusted
# publisher on npmjs.com.
#
# Triggers:
#   - push a tag norskvideo-vX.Y.Z  -> publishes X.Y.Z from the tagged commit
#   - workflow_dispatch with version -> publishes from the chosen ref. GitHub
#     only lists a dispatchable workflow that is on the default branch (main,
#     the upstream mirror), so from id3as use the API once the workflow has run:
#     gh workflow run publish-norskvideo.yml -R id3as/moq --ref id3as -f version=X.Y.Z
# A version already on the registry is skipped per package, so a re-run (or a
# tag pushed after a manual publish) is safe.
#
# runs-on is GitHub-hosted on purpose, against the estate's self-hosted rule:
# npm trusted publishing does not support self-hosted runners, the org runner
# group refuses public repos, and hosted minutes are free for public repos.
name: Publish @norskvideo/moq-*

on:
  push:
    tags: ['norskvideo-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.2.5)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-norskvideo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'id3as/moq'
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v="${REF_NAME#norskvideo-v}"; else v="$INPUT_VERSION"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::not a semver version: '$v'"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same nix setup as release-js.yml: the flake's cachix substituter keeps
      # the dev shell from building from source.
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Trusted publishing needs npm >= 11.5.1; fail here rather than with an
      # auth error part way through the set.
      - name: Check npm version
        run: |
          nix develop --command bash -c '
            v=$(npm --version)
            echo "npm $v, node $(node --version)"
            [ "$(printf "%s\n" 11.5.1 "$v" | sort -V | head -1)" = 11.5.1 ] || { echo "::error::npm $v < 11.5.1"; exit 1; }'

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Build + publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: nix develop --command bun run js/publish-norskvideo.ts --version "$VERSION" --publish
